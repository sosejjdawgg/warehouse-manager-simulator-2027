<!DOCTYPE html><head>
<title>Warehouse Manager</title>
<meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name=theme-color content="#0b0f17">
<style>
:root{
  --bg:#0b0f17; --panel:#121926; --panel2:#182132; --line:#263247; --text:#e5ecf6; --muted:#8a99b2;
  --pos:#4ade80; --neg:#f87171; --warn:#fbbf24; --accent:#38bdf8; --accent2:#0ea5e9;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#ui>*{pointer-events:auto}
.hidden{display:none!important}
#screen{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;background:rgba(9,13,20,.86);backdrop-filter:blur(2px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer;min-height:42px;transition:transform .08s,background .15s}
button:active{transform:scale(.96)}
button:hover{background:#1f2a40}
button.primary{background:linear-gradient(180deg,#22a6e8,#0b84c6);border-color:#38bdf8;color:#fff;font-weight:700}
button.danger{background:#3b1418;border-color:#7f1d1d;color:#fecaca}
button.ghost{background:transparent}
button.big{font-size:18px;padding:14px 22px;min-height:54px}
button:disabled{opacity:.45}
button.on{background:#0c4a6e;border-color:#38bdf8;color:#fff}
input,select{font:inherit;color:var(--text);background:#0d1420;border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px;max-width:100%}
input[type=range]{width:100%;padding:0}
input[type=checkbox]{min-height:auto;width:20px;height:20px}
label{display:block;margin:8px 0}
label input:not([type=checkbox]){display:block;width:100%;margin-top:4px}
label.row,label.inline{display:flex;gap:8px;align-items:center}
label.inline select{min-height:36px;padding:4px 8px}
h1,h2,h3,h4{margin:.2em 0 .5em}
h3{font-size:16px;letter-spacing:.02em}
h4{font-size:14px;color:var(--muted);margin-top:14px}
.small{font-size:13px}.tiny{font-size:11px}.muted{color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:12px;padding:12px;align-items:start}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* title */
.title{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:14px}
.logo{text-align:center}
.logo span{font-size:64px;display:block;animation:bob 2s ease-in-out infinite}
.logo h1{font-size:clamp(34px,9vw,60px);line-height:.95;letter-spacing:.06em;margin:.15em 0;background:linear-gradient(90deg,#3b82f6,#22c55e,#eab308,#f97316,#ef4444,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}
.logo p{color:var(--muted);margin:0}
.titleCard{width:min(420px,100%)}
.titleCard .big{width:100%;margin-top:8px}
.sep{text-align:center;color:var(--muted);font-size:12px;margin:12px 0 2px}
.zonesStrip{display:flex;gap:4px;margin:14px 0 8px}
.zonesStrip span{flex:1;text-align:center;border-radius:8px;padding:6px 0;font-size:18px}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}

/* hub */
.hub{max-width:1200px;margin:0 auto;padding-bottom:90px}
.top{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(11,15,23,.96);border-bottom:1px solid var(--line)}
.top .co{flex:1 1 220px;min-width:0}
.top .co b{display:block;font-size:18px}
.top .co span{color:var(--muted);font-size:13px}
.peak{color:#fb923c;font-style:normal;font-weight:800}
.kpis{display:flex;gap:14px}
.kpi small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-size:17px}
.bar{display:block;height:6px;background:#0d1420;border-radius:4px;overflow:hidden;margin-top:3px;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .4s}
.bar.big{height:12px;margin:10px 0}
.go{background:linear-gradient(180deg,#22c55e,#15803d);border-color:#4ade80;font-weight:800;color:#fff}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;position:sticky;top:var(--tabsTop,64px);z-index:4;background:rgba(11,15,23,.92);scrollbar-width:none}
.tabs button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;font-size:18px;padding:6px 12px;min-width:72px;position:relative}
.tabs button span{font-size:11px;color:var(--muted)}
.tabs button.on span{color:#fff}
.tabs button em{position:absolute;top:2px;right:6px;background:#ef4444;color:#fff;border-radius:9px;font-size:11px;font-style:normal;padding:0 6px}
@media (max-width:700px){
  .tabs{position:fixed;bottom:0;left:0;right:0;top:auto;padding-bottom:max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .top .go{flex:1 1 100%}
  .kpis{flex:1 1 100%;justify-content:space-between}
}
.hero .big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.big3 small,.mini4 small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.big3 b{display:block;font-size:clamp(20px,5vw,28px)}
.big3 span{font-size:12px;color:var(--muted)}
.mini4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:8px 0}
.mini4 b{font-size:17px}
.risk.r0{color:var(--pos)}.risk.r1{color:var(--warn)}.risk.r2{color:var(--neg);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
.notes{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.notes span{background:#1d2738;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px}
.warnCard{border-color:#a16207}
.slist{display:flex;flex-direction:column;gap:6px}
.srow,.trow,.lrow{display:grid;align-items:center;gap:8px;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.srow{grid-template-columns:minmax(120px,1.6fr) minmax(130px,1.3fr) 70px 60px 90px 1fr}
.srow .cell{display:flex;flex-direction:column;font-size:13px}
.srow .cell small{color:var(--muted)}
.nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--muted);font-size:12px}
.trow{grid-template-columns:auto 1fr auto auto auto}
.trow.you,.lrow.you{border-color:var(--accent)}
.lrow{grid-template-columns:1fr auto minmax(140px,1.1fr);border-left:5px solid var(--zc)}
.linkish{background:none;border:0;padding:0;text-align:left;min-height:0}
@media (max-width:700px){
  .srow{grid-template-columns:1fr auto;}
  .srow .cell:nth-child(n+4){display:none}
  .srow .cell:nth-child(3){grid-column:2}
  .trow{grid-template-columns:auto 1fr auto}
  .trow>*:nth-child(n+4){display:none}
}
.zpill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:12px;background:color-mix(in srgb,var(--zc) 28%,#0d1420);border:1px solid var(--zc);white-space:nowrap}
.zpill.bench{--zc:#64748b}
.stars{color:#fde047;letter-spacing:-1px;font-size:14px;white-space:nowrap}
.stars.fuzzy{color:#a3a3a3;filter:blur(.3px)}
.mdot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.tag{font-size:11px;background:#334155;border-radius:6px;padding:1px 6px;margin-right:3px}
.tag.bad{background:#7f1d1d}
.cert{font-size:10px;background:#1e3a5f;color:#bae6fd;border-radius:6px;padding:1px 5px;margin:0 2px 2px 0;display:inline-block}
.trait{font-size:12px;border-radius:12px;padding:2px 8px;margin:0 4px 4px 0;display:inline-block;background:#334155}
.trait.g{background:#14532d;color:#bbf7d0}.trait.b{background:#7f1d1d;color:#fecaca}
.seg{display:flex;gap:0;margin:10px 0;flex-wrap:wrap}
.seg button{border-radius:0;flex:1}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0}
.zcount{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.zc{border:2px solid var(--zc);border-radius:10px;padding:3px 8px;font-size:15px}
.zc b{margin-left:4px}
.warnlist p{margin:4px 0;font-size:13px;color:#fcd34d}
.eqs{display:flex;flex-wrap:wrap;gap:6px}
.eqs span{background:var(--panel2);border-radius:8px;padding:4px 8px;font-size:13px}
.startbar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:10px;justify-content:center;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(9,13,20,1) 60%,rgba(9,13,20,0));z-index:6}
.startbar .big{flex:0 1 360px}
.fac .pips{display:flex;gap:4px;margin:6px 0}
.fac .pips i{flex:1;height:8px;border-radius:4px;background:#0d1420;border:1px solid var(--line)}
.fac .pips i.on{background:linear-gradient(90deg,#22c55e,#a3e635)}
.tablewrap{overflow-x:auto}
table.league{width:100%;border-collapse:collapse;font-size:14px}
.league th,.league td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.league th{color:var(--muted);font-size:11px;text-transform:uppercase}
.league tr.you td{background:rgba(56,189,248,.12);font-weight:700}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.lline{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #1f2a3d;font-size:14px}
.lline.total{border-bottom:0;font-size:16px;padding-top:9px}
.bars,.hours{display:flex;align-items:flex-end;gap:3px;height:110px;margin:10px 0;border-bottom:1px solid var(--line)}
.bars i,.hours i{flex:1;border-radius:4px 4px 0 0;min-height:2px}
.bars i.p{background:#22c55e}.bars i.n{background:#ef4444}
.hours{height:70px}.hours i{background:linear-gradient(0deg,#0ea5e9,#7dd3fc)}
.msg{border-left:4px solid #475569;background:var(--panel2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.msg.unread{border-left-color:var(--accent)}
.msg .mh{display:flex;justify-content:space-between;gap:8px}
.msg p{margin:6px 0 0;font-size:14px}
.msg.t-poach,.msg.t-injury{border-left-color:#ef4444}
.msg.t-board{border-left-color:#a855f7}
.msg.t-deal{border-left-color:#eab308}
.rt{display:inline-block;min-width:38px;text-align:center;border-radius:8px;padding:2px 6px;font-weight:800;font-size:13px}
.rt.r4{background:#15803d}.rt.r3{background:#3f6212}.rt.r2{background:#854d0e}.rt.r1{background:#991b1b}
.form{display:flex;gap:4px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
.mbox{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:760px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .22s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.x{min-height:34px;padding:4px 10px;background:transparent}
.mclose{position:absolute;top:10px;right:10px}
.sdh{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;padding-right:34px}
.sdh h2{margin:0}
.sdh p{margin:4px 0;color:var(--muted)}
.sdk{display:grid;grid-template-columns:repeat(2,auto);gap:4px 14px;font-size:13px}
.sdk small{color:var(--muted);margin-right:6px}
.sdcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.sdcols{grid-template-columns:1fr}}
.attr{display:grid;grid-template-columns:1fr 46px;gap:2px 6px;font-size:13px;margin-bottom:5px}
.attr .ab{grid-column:1/3;height:4px;background:#0d1420;border-radius:3px;overflow:hidden;display:block}
.attr .ab i{display:block;height:100%}
.attr b{text-align:right}
.a1{color:#f87171}.a2{color:#fbbf24}.a3{color:#4ade80}.a4{color:#22d3ee}
.ab .a1{background:#f87171}.ab .a2{background:#fbbf24}.ab .a3{background:#4ade80}.ab .a4{background:#22d3ee}
b.fuzzy{color:#a3a3a3}
.zrs{display:grid;grid-template-columns:1fr;gap:4px}
.zr{display:flex;justify-content:space-between;align-items:center}
.bigline{font-size:22px}

/* shift HUD */
.hudTop{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;padding:8px;padding-top:max(8px,env(safe-area-inset-top));justify-content:center;flex-wrap:wrap;pointer-events:none}
.hudTop>*{pointer-events:auto}
.clock,.chip{background:rgba(13,19,30,.88);border:1px solid var(--line);border-radius:12px;padding:5px 10px;min-width:74px;text-align:center}
.clock{min-width:110px}
.clock b{font-size:20px;font-variant-numeric:tabular-nums}
.chip small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chip b{font-size:17px;font-variant-numeric:tabular-nums}
.chip span{font-size:12px;color:var(--muted)}
.chip.flow b{color:#7dd3fc}
.pulse{animation:pulse .35s ease-out}
@keyframes pulse{0%{transform:scale(1.25);color:#fff;text-shadow:0 0 12px #38bdf8}}
.hudBot{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));pointer-events:none}
.hudBot .seg{margin:0;pointer-events:auto;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.hudBot button{min-height:44px;padding:6px 12px;background:rgba(24,33,50,.95)}
.hudBot button.on{background:#0c4a6e}
@media (max-width:700px){.hudBot button{padding:6px 8px;font-size:13px}.chip{min-width:60px;padding:4px 7px}.chip b{font-size:15px}.clock b{font-size:17px}}
#toasts{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:15;width:min(560px,94vw)}
.toast{background:rgba(13,19,30,.95);border:1px solid;border-left-width:5px;border-radius:10px;padding:7px 12px;font-size:14px;animation:tin .25s cubic-bezier(.2,1.4,.4,1);transition:opacity .5s,transform .5s;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.toast.out{opacity:0;transform:translateY(-10px)}
@keyframes tin{from{transform:translateY(14px) scale(.9);opacity:0}}
#workerCard{position:fixed;left:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:12;width:min(320px,calc(100vw - 16px))}
.wc{background:rgba(13,19,30,.96);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.wc .btnrow{margin-top:6px}.wc button{min-height:38px;padding:5px 10px;font-size:13px}

/* cinematic */
#cine{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(14,30,55,.75),rgba(0,0,0,.85))}
.cineBox{text-align:center;padding:30px;cursor:pointer;max-width:90vw}
.cineIcon{font-size:96px;filter:drop-shadow(0 0 30px rgba(253,224,71,.6))}
.cineBox h1{font-size:clamp(28px,7vw,54px);letter-spacing:.04em;background:linear-gradient(90deg,#fde047,#f97316,#fde047);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2s linear infinite}
.cineBox p{font-size:18px;color:#e2e8f0}
.cineBox small{color:var(--muted)}
#cine.play .cineIcon{animation:cineIn .8s cubic-bezier(.2,1.6,.4,1)}
#cine.play h1{animation:cineUp .7s .15s both cubic-bezier(.2,1.3,.4,1),shine 2s linear infinite}
@keyframes cineIn{from{transform:scale(0) rotate(-40deg)}}
@keyframes cineUp{from{transform:translateY(30px);opacity:0}}
@keyframes shine{to{background-position:200% 0}}
body.inShift #screen{display:none}
body.inShift #toasts{bottom:auto;top:calc(74px + env(safe-area-inset-top))}
body.inShift .toast{background:rgba(13,19,30,.8);font-size:13px;padding:5px 10px}
@media (max-width:700px){body.inShift #toasts{top:calc(118px + env(safe-area-inset-top))}}
</style>
</head><body>
<script src=dist/littlejs.js></script>
<script src=templates/gameFx.js></script>
<script src=src/data.js></script>
<script src=src/warehouseMap.js></script>
<script src=src/model.js></script>
<script src=src/shiftSim.js></script>
<script src=src/floor.js></script>
<script src=src/ui.js></script>
<script src=game.js></script>
</body>
