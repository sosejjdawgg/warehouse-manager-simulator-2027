<!DOCTYPE html><head>
<title>Warehouse Manager</title>
<meta name=author content="James Scott">
<meta name=copyright content="© 2026 James Scott. All rights reserved.">
<meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name=theme-color content="#0b0f17">
<style>
:root{
  --ink:#2b2d42; --bg:#8fd17a; --panel:#ffffff; --panel2:#f4f1ff; --line:#2b2d42; --text:#2b2d42; --muted:#6b6f86;
  --pos:#2fb344; --neg:#e5383b; --warn:#e08a00; --accent:#3ec1ff; --accent2:#1e9be0; --sun:#ffd23f;
  --r:22px; --pop:0 5px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:600 15px/1.35 "Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#ui>*{pointer-events:auto}
.hidden{display:none!important}
#screen{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;background:linear-gradient(180deg,rgba(120,205,255,.88),rgba(190,160,255,.82));-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;font-weight:700;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 14px;cursor:pointer;min-height:44px;box-shadow:var(--pop);transition:transform .08s,box-shadow .08s,background .15s;position:relative;top:0}
button:hover{background:#fff7d6}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button.primary{background:linear-gradient(180deg,#5fd1ff,#1fa4ec);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
button.danger{background:linear-gradient(180deg,#ff7a7a,#e5383b);color:#fff}
button.ghost{background:#fffdf5}
button.big{font-size:19px;padding:12px 22px;min-height:56px;border-radius:20px}
button:disabled{opacity:.5;filter:grayscale(.6)}
button.on{background:linear-gradient(180deg,#ffe066,#ffc21a)}
input,select{font:inherit;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;min-height:44px;max-width:100%}
input[type=range]{width:100%;padding:0;border:0;accent-color:#ff7b39}
input[type=checkbox]{min-height:auto;width:22px;height:22px;accent-color:#2fb344}
label{display:block;margin:8px 0;font-weight:600}
label input:not([type=checkbox]):not([type=range]){display:block;width:100%;margin-top:4px}
label.row,label.inline{display:flex;gap:8px;align-items:center}
label.inline select{min-height:38px;padding:4px 8px}
h1,h2,h3,h4{margin:.2em 0 .5em;font-weight:700}
h3{font-size:19px}
h4{font-size:15px;color:var(--muted);margin-top:14px}
.small{font-size:13.5px}.tiny{font-size:11.5px}.muted{color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.card{background:var(--panel);border:3px solid var(--ink);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:0 7px 0 var(--ink);animation:cardIn .35s cubic-bezier(.2,1.5,.4,1) both}
@keyframes cardIn{from{transform:translateY(16px) scale(.97);opacity:0}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;padding:14px;align-items:start}
.grid>.card:nth-child(2){animation-delay:.05s}.grid>.card:nth-child(3){animation-delay:.1s}.grid>.card:nth-child(4){animation-delay:.15s}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linkish{background:none!important;border:0!important;box-shadow:none!important;padding:0;text-align:left;min-height:0}

/* title */
.title{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:14px}
.logo{text-align:center}
.logo span{font-size:72px;display:block;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(43,45,66,.35))}
.logo h1{font-size:clamp(38px,10vw,68px);line-height:.92;letter-spacing:.03em;margin:.15em 0;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.logo p{color:var(--ink);margin:6px 0 0;font-size:17px}
.titleCard{width:min(460px,100%)}
.titleCard .big{width:100%;margin-top:10px}
.sep{text-align:center;color:var(--muted);font-size:13px;margin:12px 0 2px}
.zonesStrip{display:flex;gap:5px;margin:14px 0 8px}
.zonesStrip span{flex:1;text-align:center;border-radius:12px;padding:6px 0;font-size:18px;border:3px solid var(--ink)}
.titleMgr{display:flex;gap:12px;align-items:center;margin:6px 0}
details summary{cursor:pointer;margin:6px 0;font-weight:700}
@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}

/* hub */
.hub{max-width:1220px;margin:0 auto;padding-bottom:96px}
.top{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:#fffdf5;border-bottom:4px solid var(--ink);box-shadow:0 4px 0 rgba(43,45,66,.15)}
.top .co{flex:1 1 200px;min-width:0}
.top .co b{display:block;font-size:21px;-webkit-text-stroke:.6px var(--ink)}
.top .co span{color:var(--muted);font-size:13.5px}
.peak{color:#ff5d2a;font-style:normal;font-weight:800}
.kpis{display:flex;gap:14px}
.kpi small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-size:18px}
.bar{display:block;height:9px;background:#e9e6f5;border:2px solid var(--ink);border-radius:9px;overflow:hidden;margin-top:3px;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .4s}
.bar.big{height:16px;margin:8px 0}
.go{background:linear-gradient(180deg,#7ee36b,#34b233);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);font-size:18px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;position:sticky;top:var(--tabsTop,74px);z-index:4;scrollbar-width:none}
.tabs button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;font-size:20px;padding:4px 10px;min-width:74px;min-height:56px}
.tabs button span{font-size:11.5px;color:var(--ink)}
.tabs button em{position:absolute;top:-8px;right:-6px;background:#ff4d4d;color:#fff;border:2px solid var(--ink);border-radius:12px;font-size:12px;font-style:normal;padding:0 7px}
@media (max-width:760px){
  .tabs{position:fixed;bottom:0;left:0;right:0;top:auto;padding-bottom:max(8px,env(safe-area-inset-bottom));background:#fffdf5;border-top:4px solid var(--ink);z-index:8}
  .top .go{flex:1 1 100%}
  .kpis{flex:1 1 100%;justify-content:space-between}
}
.hero .big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.big3 small,.mini4 small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.big3 b{display:block;font-size:clamp(22px,5vw,30px)}
.big3 span{font-size:12.5px;color:var(--muted)}
.mini4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:10px 0}
.mini4>div{background:var(--panel2);border:2px solid var(--ink);border-radius:14px;padding:6px 2px}
.mini4 b{font-size:17px}
.risk.r0{color:var(--pos)}.risk.r1{color:var(--warn)}.risk.r2{color:var(--neg);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
.notes{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.notes span{background:#fff4c2;border:2px solid var(--ink);border-radius:20px;padding:3px 11px;font-size:13px}
.notes.mods span.good{background:#d7f8c9}.notes.mods span.bad{background:#ffd6d6}
.warnCard{background:#fff8d6}
.slist{display:flex;flex-direction:column;gap:8px}
.srow,.trow,.lrow{display:grid;align-items:center;gap:8px;text-align:left;width:100%;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 10px;box-shadow:0 3px 0 var(--ink)}
.srow{grid-template-columns:minmax(150px,1.7fr) minmax(130px,1.2fr) 70px 60px 90px 1fr;font-weight:600}
.srow .cell{display:flex;flex-direction:column;font-size:13px}
.srow .cell small{color:var(--muted)}
.nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--muted);font-size:12px}
.nm.withAva{display:flex;align-items:center;gap:8px;min-width:0}
.nm.withAva>span{min-width:0}
.trow{grid-template-columns:auto 1fr auto auto auto}
.trow.you,.lrow.you{background:#e3f6ff}
.lrow{grid-template-columns:1fr auto minmax(140px,1.1fr);border-left:10px solid var(--zc)}
@media (max-width:760px){
  .srow{grid-template-columns:1fr auto}
  .srow .cell:nth-child(n+4){display:none}
  .srow .cell:nth-child(3){grid-column:2}
  .trow{grid-template-columns:auto 1fr auto}
  .trow>*:nth-child(n+4){display:none}
}
.avaWrap{position:relative;display:inline-block;line-height:0;flex:0 0 auto}
.avaWrap .ava{background:radial-gradient(circle at 50% 40%,#fff,#e3eefe);border:2.5px solid var(--ink);border-radius:50%}
.avaWrap.hg .ava{background:radial-gradient(circle at 50% 40%,#fff,#d7f8c9)}
.hgBadge{position:absolute;right:-4px;bottom:-2px;font-style:normal;font-size:14px;line-height:1;filter:drop-shadow(0 1px 0 #fff)}
.zpill{display:inline-block;font-size:12.5px;padding:1px 9px;border-radius:12px;background:color-mix(in srgb,var(--zc) 30%,#fff);border:2px solid var(--ink);white-space:nowrap}
.zpill.bench{--zc:#94a3b8}
.stars{color:#ffb800;letter-spacing:-1px;font-size:15px;white-space:nowrap;-webkit-text-stroke:.6px var(--ink)}
.stars.fuzzy{color:#c8c8d0}
.mdot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);vertical-align:middle}
.tag{font-size:11.5px;background:#e9e6f5;border:2px solid var(--ink);border-radius:8px;padding:0 6px;margin-right:3px}
.tag.bad{background:#ffd6d6}
.cert{font-size:10.5px;background:#d6f1ff;border:2px solid var(--ink);border-radius:8px;padding:0 5px;margin:0 2px 2px 0;display:inline-block}
.trait{font-size:12.5px;border:2px solid var(--ink);border-radius:12px;padding:1px 9px;margin:0 4px 4px 0;display:inline-block;background:#f1f1f6}
.trait.g{background:#d7f8c9}.trait.b{background:#ffd6d6}
.seg{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.seg button{flex:1}
.zcount{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.zc{border:3px solid var(--zc);background:#fff;border-radius:12px;padding:2px 8px;font-size:15px}
.zc b{margin-left:4px}
.warnlist p{margin:4px 0;font-size:13.5px;color:#b45309}
.eqs{display:flex;flex-wrap:wrap;gap:6px}
.eqs span{background:var(--panel2);border:2px solid var(--ink);border-radius:10px;padding:3px 9px;font-size:13px}
.startbar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:10px;justify-content:center;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(190,160,255,1) 55%,rgba(190,160,255,0));z-index:9}
.startbar .big{flex:0 1 360px}
.fac .pips{display:flex;gap:5px;margin:8px 0}
.fac .pips i{flex:1;height:14px;border-radius:7px;background:#ece9f7;border:2px solid var(--ink)}
.fac .pips i.on{background:linear-gradient(180deg,#9ef07f,#34b233)}
.tablewrap{overflow-x:auto}
table.league{width:100%;border-collapse:separate;border-spacing:0 5px;font-size:14px}
.league th,.league td{padding:7px 6px;text-align:left;white-space:nowrap}
.league td{background:#fff;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.league td:first-child{border-left:2px solid var(--ink);border-radius:12px 0 0 12px}
.league td:last-child{border-right:2px solid var(--ink);border-radius:0 12px 12px 0}
.league th{color:var(--muted);font-size:11.5px;text-transform:uppercase}
.league tr.you td{background:#fff1a8;font-weight:700}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid var(--ink);margin-right:6px;vertical-align:middle}
.lline{display:flex;justify-content:space-between;padding:5px 0;border-bottom:2px dashed #e2def0;font-size:14.5px}
.lline.total{border-bottom:0;font-size:17px;padding-top:9px}
.bars,.hours{display:flex;align-items:flex-end;gap:4px;height:110px;margin:10px 0;border-bottom:3px solid var(--ink)}
.bars i,.hours i{flex:1;border-radius:6px 6px 0 0;min-height:3px;border:2px solid var(--ink);border-bottom:0}
.bars i.p{background:#7ee36b}.bars i.n{background:#ff7a7a}
.hours{height:74px}.hours i{background:linear-gradient(0deg,#1fa4ec,#8fdcff)}
.msg{border:3px solid var(--ink);border-left-width:10px;border-left-color:#c7c3d9;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:9px}
.msg.unread{border-left-color:var(--accent)}
.msg .mh{display:flex;justify-content:space-between;gap:8px}
.msg p{margin:6px 0 0;font-size:14px;font-weight:500}
.msg.t-poach,.msg.t-injury{border-left-color:#ff4d4d}
.msg.t-board{border-left-color:#a855f7}
.msg.t-deal{border-left-color:#ffd23f}
.rt{display:inline-block;min-width:40px;text-align:center;border-radius:10px;border:2px solid var(--ink);padding:1px 6px;font-weight:800;font-size:13.5px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.rt.r4{background:#2fb344}.rt.r3{background:#8cc63f}.rt.r2{background:#f5a623}.rt.r1{background:#e5383b}
.form{display:flex;gap:4px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(43,45,66,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
.mbox{position:relative;background:#fffdf5;border:4px solid var(--ink);border-radius:26px;padding:20px;max-width:780px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 10px 0 var(--ink);animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7) rotate(-2deg);opacity:0}}
.x{min-height:36px;padding:2px 10px}
.mclose{position:absolute;top:12px;right:12px}
.sdh{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-start;padding-right:44px}
.sdh h2{margin:0}
.sdh p{margin:4px 0;color:var(--muted)}
.sdk{display:grid;grid-template-columns:repeat(2,auto);gap:4px 14px;font-size:13.5px}
.sdk small{color:var(--muted);margin-right:6px}
.sdcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.sdcols{grid-template-columns:1fr}}
.attr{display:grid;grid-template-columns:1fr 46px;gap:2px 6px;font-size:13.5px;margin-bottom:6px}
.attr .ab{grid-column:1/3;height:9px;background:#ece9f7;border:2px solid var(--ink);border-radius:6px;overflow:hidden;display:block}
.attr .ab i{display:block;height:100%}
.attr b{text-align:right}
.a1{color:#e5383b}.a2{color:#e08a00}.a3{color:#2fb344}.a4{color:#1e9be0}
.ab .a1{background:#ff7a7a}.ab .a2{background:#ffc94d}.ab .a3{background:#7ee36b}.ab .a4{background:#5fd1ff}
b.fuzzy{color:#a8a8b8}
.zrs{display:grid;grid-template-columns:1fr;gap:4px}
.zr{display:flex;justify-content:space-between;align-items:center}
.bigline{font-size:24px}

/* creator & customisation */
.preview{line-height:0;border:4px solid var(--ink);border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff,#d6f1ff);box-shadow:0 6px 0 var(--ink);display:inline-block}
.preview.boing{animation:boing .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes boing{from{transform:scale(.85,1.12)}}
.creator{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
@media (max-width:560px){.creator{grid-template-columns:1fr;justify-items:center}}
.nameRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lookPicker{display:flex;flex-direction:column;gap:6px}
.lpRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lpRow>span{width:84px;font-size:13px;color:var(--muted)}
.lpOpts{display:flex;gap:5px;flex-wrap:wrap}
.lpOpt{min-height:34px;min-width:34px;padding:2px 8px;border-radius:12px;font-size:12.5px;box-shadow:0 3px 0 var(--ink)}
.lpOpt.on{outline:3px solid #ff7b39;outline-offset:2px}
.archGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.arch{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px}
.arch span{font-size:26px}.arch small{font-weight:500;font-size:11.5px;color:var(--muted)}
.kidGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kid{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 6px;box-shadow:0 4px 0 var(--ink)}
.kid small{font-weight:500;font-size:11.5px}
.kid.pick{cursor:pointer}
.kid.pick input{align-self:flex-start;margin:0}
.growth{display:block;width:90%;height:10px;border:2px solid var(--ink);border-radius:6px;background:#ece9f7;overflow:hidden}
.growth>i{display:block;height:100%;background:linear-gradient(90deg,#9ef07f,#34b233)}
.academyHero{background:linear-gradient(180deg,#f0ffe8,#fff)}
.mgrCard{background:linear-gradient(180deg,#fff7d6,#fff)}
.mgrTop{display:flex;gap:14px;align-items:center}
.repBar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.trophy{background:#fff4c2;border:2px solid var(--ink);border-radius:12px;padding:5px 10px;margin:5px 0}
.memorial{background:linear-gradient(180deg,#eef0f6,#fff)}
.mem{display:flex;gap:10px;align-items:center;margin:6px 0;filter:grayscale(.75)}
.mem small{display:block;color:var(--muted);font-weight:500}
.offer{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;border:3px solid var(--ink);border-left:12px solid var(--oc);border-radius:16px;padding:10px;margin:8px 0;background:#fff}
.offer small{display:block;color:var(--muted);font-weight:500}
.offer .small{grid-column:1}
.offer button{grid-row:1/3;grid-column:2}
.offerHead{display:flex;gap:12px;align-items:center}
.sdAva{flex:0 0 auto}

/* days-without-accident board */
.safeBoard{display:flex;align-items:center;gap:8px;background:#2fb344;border:3px solid var(--ink);border-radius:14px;padding:4px 10px;box-shadow:0 4px 0 var(--ink);color:#fff}
.safeBoard .sbTitle{font-size:10px;line-height:1.05;text-align:left;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.safeBoard .sbDigits{display:flex;gap:3px}
.safeBoard .sbDigits span{background:#1d2333;color:#ffd23f;font-size:24px;line-height:1;padding:4px 6px;border-radius:7px;font-variant-numeric:tabular-nums;border:2px solid #000}
.safeBoard .sbBest{font-size:10px}
.safeBoard.small .sbDigits span{font-size:19px}
#hudSafeBoard{position:fixed;left:8px;top:max(8px,env(safe-area-inset-top));z-index:3}
#hudSafeBoard.reset{background:#e5383b;animation:sbReset 1s ease-out}
@keyframes sbReset{0%{transform:scale(1.4) rotate(-6deg)}20%{transform:scale(1.2) rotate(6deg)}40%{transform:scale(1.25) rotate(-4deg)}100%{transform:none}}
@media (max-width:760px){#hudSafeBoard{top:calc(66px + env(safe-area-inset-top));left:4px;transform:scale(.62);transform-origin:left top}body.inShift #toasts .toast:nth-child(n+3){display:none}}

/* shift HUD */
.hudTop{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;padding:8px;padding-top:max(8px,env(safe-area-inset-top));justify-content:center;flex-wrap:wrap;pointer-events:none}
.hudTop>*{pointer-events:auto}
.clock,.chip{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:3px 10px;min-width:76px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.clock{min-width:112px;background:#fff7d6}
.clock b{font-size:21px;font-variant-numeric:tabular-nums}
.chip small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chip b{font-size:18px;font-variant-numeric:tabular-nums}
.chip span{font-size:12px;color:var(--muted)}
.chip.flow b{color:#1e9be0}
.pulse{animation:pulse .35s ease-out}
@keyframes pulse{0%{transform:scale(1.35)}}
.hudBot{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:6px 8px;padding-bottom:max(8px,env(safe-area-inset-bottom));pointer-events:none}
.hudBot .seg{margin:0;pointer-events:auto;gap:4px}
.hudBot button{min-height:46px;padding:4px 12px}
@media (max-width:760px){.hudBot button{padding:4px 8px;font-size:13px;min-height:42px}.chip{min-width:58px;padding:2px 6px}.chip b{font-size:15px}.clock b{font-size:17px}}
#toasts{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:15;width:min(560px,94vw)}
.toast{background:#fff;border:3px solid var(--ink);border-left-width:10px;border-radius:14px;padding:6px 12px;font-size:14.5px;animation:tin .3s cubic-bezier(.2,1.6,.4,1);transition:opacity .5s,transform .5s;box-shadow:0 4px 0 var(--ink)}
.toast.out{opacity:0;transform:translateY(-10px)}
@keyframes tin{from{transform:translateY(14px) scale(.8);opacity:0}}
body.inShift #screen{display:none}
body.inShift #toasts{bottom:auto;top:calc(80px + env(safe-area-inset-top))}
body.inShift .toast{font-size:13.5px;padding:4px 10px}
@media (max-width:760px){body.inShift #toasts{top:calc(124px + env(safe-area-inset-top))}}
#workerCard{position:fixed;right:8px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:12;width:min(320px,calc(100vw - 16px))}
.wc{background:#fffdf5;border:3px solid var(--ink);border-radius:18px;padding:10px 12px;box-shadow:0 6px 0 var(--ink)}
.wc .btnrow{margin-top:6px}.wc button{min-height:38px;padding:3px 10px;font-size:13px}

/* milestone cinematic */
#cine{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,240,170,.92),rgba(255,140,60,.88))}
.cineBox{text-align:center;padding:30px;cursor:pointer;max-width:90vw}
.cineIcon{font-size:110px;filter:drop-shadow(0 8px 0 rgba(43,45,66,.4))}
.cineBox h1{font-size:clamp(32px,8vw,60px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.cineBox p{font-size:20px;color:var(--ink)}
.cineBox small{color:var(--ink)}
#cine.play .cineIcon{animation:cineIn .8s cubic-bezier(.2,1.8,.4,1)}
#cine.play h1{animation:cineUp .7s .15s both cubic-bezier(.2,1.5,.4,1)}
@keyframes cineIn{from{transform:scale(0) rotate(-60deg)}}
@keyframes cineUp{from{transform:translateY(40px) scale(.6);opacity:0}}

/* story cutscenes */
#story{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;opacity:0;transition:opacity .25s}
#story.in{opacity:1}
#story .lb{position:absolute;left:0;right:0;height:9vh;background:#11131c;transition:transform .45s cubic-bezier(.2,1,.3,1);z-index:2}
#story .lb.top{top:0;transform:translateY(-100%)}#story .lb.bot{bottom:0;transform:translateY(100%)}
#story.in .lb.top,#story.in .lb.bot{transform:none}
#story .stage{position:absolute;inset:0;overflow:hidden}
#story .set{position:absolute;inset:0;background:
   repeating-linear-gradient(90deg,transparent 0 120px,rgba(43,45,66,.18) 120px 132px),
   linear-gradient(180deg,transparent 55%,rgba(43,45,66,.25) 55% 56%,transparent 56%)}
#story.bg-dawn{background:linear-gradient(180deg,#ffb3a7,#ffe29a 60%,#c8e6a0)}
#story.bg-office{background:linear-gradient(180deg,#b9d7ff,#f1ecff)}
#story.bg-floor{background:linear-gradient(180deg,#ffe8b8,#f6d9a8)}
#story.bg-breakroom{background:linear-gradient(180deg,#ffd0e1,#ffeef4)}
#story.bg-press{background:radial-gradient(circle at 30% 30%,#fff,#d6e4ff);}
#story.bg-dusk{background:linear-gradient(180deg,#5b4a9e,#ff8f6b)}
#story.bg-night{background:linear-gradient(180deg,#151827,#2d3350)}
#story.bg-party{background:conic-gradient(from 0deg,#ffd23f,#ff7b9c,#7ee36b,#5fd1ff,#ffd23f)}
#story .actor{position:absolute;bottom:calc(9vh + 150px);line-height:0;transition:transform .3s cubic-bezier(.2,1.6,.4,1),filter .3s;filter:brightness(.6) saturate(.6);transform:scale(.9)}
#story .actor.left{left:6vw}#story .actor.right{right:6vw}
#story .actor .ava{background:radial-gradient(circle at 50% 40%,#fff,#e8f4ff);border:4px solid var(--ink);border-radius:50%;box-shadow:0 8px 0 var(--ink)}
#story .actor.speaking{filter:none;transform:scale(1.06);animation:talk .5s ease-in-out infinite alternate}
@keyframes talk{to{transform:scale(1.06) translateY(-6px)}}
#story .dlg{position:relative;z-index:3;margin:0 auto calc(9vh + 12px);width:min(820px,94vw);background:#fffdf5;border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:26px 18px 16px;min-height:130px}
#story .plate{position:absolute;top:-20px;left:18px;background:#ffd23f;border:3px solid var(--ink);border-radius:14px;padding:2px 12px;box-shadow:0 3px 0 var(--ink)}
#story .plate b{font-size:17px}#story .plate small{margin-left:8px;color:#6b4f00}
#story .plate:has(b:empty){display:none}
#story .txt{font-size:18px;line-height:1.45;min-height:52px}
#story .next{position:absolute;right:18px;bottom:8px;animation:bob 1s infinite}
#story .choices{display:flex;flex-direction:column;gap:8px;margin-top:10px;cursor:default}
#story .choice{display:flex;flex-direction:column;text-align:left;gap:2px}
#story .choice small{font-weight:500;color:var(--muted)}
#story .chips{display:flex;flex-wrap:wrap;gap:6px}
#story .chip{min-width:0;padding:3px 10px;border-radius:12px;font-size:13.5px;box-shadow:0 3px 0 var(--ink)}
#story .chip.good{background:#d7f8c9}#story .chip.bad{background:#ffd6d6}
@media (max-width:640px){#story .actor .ava{width:128px;height:128px}#story .actor{bottom:auto;top:calc(9vh + 16px)}#story .actor.right{top:calc(9vh + 60px)}#story .txt{font-size:16px}}

/* ===== spectacle: parallax flyovers ===== */
#parallax{position:fixed;inset:0;z-index:45;overflow:hidden;cursor:pointer;opacity:0;transition:opacity .3s}
#parallax.run{opacity:1}#parallax.out{opacity:0}
#parallax.sky-dawn{background:linear-gradient(180deg,#7ec8ff 0%,#ffc4a8 55%,#ffe7a3 75%)}
#parallax.sky-day{background:linear-gradient(180deg,#4fb4ff,#bfe6ff 70%)}
#parallax.sky-sunset{background:linear-gradient(180deg,#5b4fc4 0%,#ff7b9c 45%,#ffb347 75%)}
#parallax.sky-night{background:linear-gradient(180deg,#0b0f2a,#2c2a6b 70%)}
#parallax.sky-rain{background:linear-gradient(180deg,#5d6680,#9aa3b6 70%)}
.pxSun{position:absolute;width:26vmin;height:26vmin;border-radius:50%;right:12vw;top:12vh;background:radial-gradient(circle,#fff6c2,#ffd23f 60%,rgba(255,210,63,0) 72%);animation:sunRise 4.5s ease-out both}
.sky-night .pxSun{background:radial-gradient(circle,#ffffff,#e7ecff 55%,rgba(231,236,255,0) 70%);width:14vmin;height:14vmin}
.sky-rain .pxSun{display:none}
@keyframes sunRise{from{transform:translateY(18vh)}}
.pxl{position:absolute;left:0;top:0;height:100%;animation:pxPan var(--dur) cubic-bezier(.25,.1,.25,1) both}
.pxl svg{display:block}
@keyframes pxPan{from{transform:translateX(0)}to{transform:translateX(var(--travel))}}
.pxl.clouds{animation-timing-function:linear}
.pxl.grow svg{transform-origin:50% 100%;animation:growUp 1.4s .3s cubic-bezier(.2,1.6,.4,1) both}
@keyframes growUp{from{transform:scaleY(.2)}}
.pxl.trucks{animation-timing-function:ease-in}
.pxFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:flash .5s ease-out both}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.pxCard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:12px}
.pxCard.left{align-items:flex-start;padding-left:5vw}
.pxCard.ctop{justify-content:flex-start;padding-top:5vh}
.pxCard.ctop .trophyCard{background:rgba(255,253,245,.9)}
.pxCard.ctop .bigTrophy{font-size:70px}
@media (max-width:640px){.pxCard.left{align-items:center;padding-left:12px}.pxCard.left .holeCard,.pxCard.left .trophyCard{margin-bottom:22vh}}
.pxSkip{position:absolute;right:14px;bottom:14px;background:rgba(43,45,66,.75);color:#fff;border-radius:12px;padding:4px 10px;font-size:13px;animation:blink 1.4s infinite}
.barry{margin-top:10px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-size:15px;box-shadow:0 4px 0 var(--ink);max-width:560px}
/* "course card" before a shift */
.holeCard{width:min(520px,92vw);background:linear-gradient(180deg,rgba(20,24,52,.92),rgba(43,45,66,.92));color:#fff;border:4px solid #ffd23f;border-radius:22px;padding:14px 18px;box-shadow:0 8px 0 var(--ink),0 0 0 4px var(--ink);animation:cardSlide .6s .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardSlide{from{transform:translateX(-120vw) skewX(-12deg)}}
.hcTop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px dashed rgba(255,210,63,.5);padding-bottom:6px}
.hcNo{font-size:30px;font-weight:700;font-style:italic;color:#ffd23f;-webkit-text-stroke:1.5px var(--ink);text-shadow:0 3px 0 var(--ink)}
.hcDay{font-size:13px;opacity:.85}
.hcBig{text-align:center;margin:6px 0}
.hcBig small{display:block;font-size:12px;letter-spacing:.2em;opacity:.8}
.hcBig b{font-size:54px;line-height:1;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 #ff8a1f}
.hcRows{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:14px}
.hcRows div{display:flex;justify-content:space-between;background:rgba(255,255,255,.08);border-radius:8px;padding:2px 8px}
.hcCond{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.hcCond span{background:#ffd23f;color:var(--ink);border-radius:10px;padding:1px 8px;font-size:12.5px}
.holeCard .barry{color:var(--ink);font-size:14px}
.pxReady{position:absolute;bottom:16vh;left:0;right:0;text-align:center;font-weight:900;font-style:italic;pointer-events:none}
.pxReady span{position:absolute;left:0;right:0;font-size:clamp(46px,11vw,110px);color:#ffd23f;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);opacity:0}
.pxReady .r1{animation:readyIn .7s 2.6s both}
.pxReady .r2{animation:goIn .8s 3.4s both;color:#7ee36b}
@keyframes readyIn{0%{opacity:0;transform:scale(2.4)}30%{opacity:1;transform:scale(.95)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
@keyframes goIn{0%{opacity:0;transform:scale(3) rotate(-8deg)}35%{opacity:1;transform:scale(.9) rotate(2deg)}100%{opacity:1;transform:scale(1.05)}}
/* end-of-shift grade */
.endCard,.trophyCard{width:min(560px,94vw);text-align:center;background:rgba(255,253,245,.95);border:4px solid var(--ink);border-radius:26px;padding:14px 16px 16px;box-shadow:0 10px 0 var(--ink);animation:pop .55s .35s cubic-bezier(.2,1.6,.4,1) both}
.endCard.dark,.trophyCard.dark{background:rgba(30,33,52,.93);color:#e6e9f5}
.grade{font-size:120px;line-height:.9;font-weight:900;font-style:italic;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);animation:gradeSlam .7s .7s cubic-bezier(.2,1.8,.4,1) both;display:inline-block}
@keyframes gradeSlam{0%{transform:scale(4) rotate(-25deg);opacity:0}60%{transform:scale(.85) rotate(4deg);opacity:1}100%{transform:none}}
.gS{color:#ff5d8f;animation:gradeSlam .7s .7s cubic-bezier(.2,1.8,.4,1) both,hue 1.2s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.grade.candle{-webkit-text-stroke:0;text-shadow:none;font-size:90px;animation:cineIn 1.2s .5s both}
.gA{color:#ffd23f}.gB{color:#7ee36b}.gC{color:#5fd1ff}.gD{color:#c38bff}.gF{color:#ff5a5a}
.endTitle{font-size:clamp(28px,6vw,44px);font-weight:900;font-style:italic;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);animation:cineUp .6s 1s both}
.endTitle.red{color:#ff5a5a}
.endStats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0;animation:cineUp .5s 1.2s both}
.endStats span{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:2px 9px;font-size:14px}
.mvp{display:flex;gap:12px;align-items:center;justify-content:center;margin:8px auto;background:linear-gradient(90deg,#fff1a8,#ffe0f0);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:6px 14px;width:fit-content;animation:mvpIn .6s 1.5s cubic-bezier(.2,1.5,.4,1) both;text-align:left}
.mvp small{display:block;font-size:11px;letter-spacing:.12em;color:#b45309}
.mvp b{font-size:20px;margin-right:6px}
.mvp em{font-style:normal;font-size:12px}
.mvpAva .ava{border:3px solid var(--ink);border-radius:50%;background:#fff}
@keyframes mvpIn{from{transform:translateX(60vw) rotate(8deg);opacity:0}}
.endCard .barry,.trophyCard .barry{animation:cineUp .5s 1.8s both;margin:10px auto 0;color:var(--ink)}
/* trophy / chapter scenes */
.bigTrophy{font-size:110px;line-height:1;animation:cineIn 1s .3s cubic-bezier(.2,1.8,.4,1) both,bob 1.8s 1.3s infinite;filter:drop-shadow(0 8px 0 rgba(43,45,66,.4))}
.crewRow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.crewMember{display:flex;flex-direction:column;align-items:center;animation:crewHop .6s cubic-bezier(.2,1.6,.4,1) both, hop 1s 1.2s ease-in-out infinite}
.crewMember .ava{border:3px solid var(--ink);border-radius:50%;background:#fff}
.crewMember small{font-size:12px;font-weight:700}
@keyframes crewHop{from{transform:translateY(80px) scale(.4);opacity:0}}
@keyframes hop{50%{transform:translateY(-10px)}}
.sadMgr{position:relative;display:inline-block;animation:walkOff 5s linear both}
.sadMgr .ava{border:3px solid var(--ink);border-radius:50%;background:#cfd6e4}
.boxOfStuff{position:absolute;right:-24px;bottom:-6px;font-size:46px}
@keyframes walkOff{from{transform:translateX(-30vw)}to{transform:translateX(10vw)}}
.fw{position:absolute;width:12px;height:12px;border-radius:50%;opacity:0;animation:fw 1.6s ease-out infinite}
.fw::before{content:'';position:absolute;inset:-70px;border-radius:50%;background:radial-gradient(circle,transparent 30%,currentColor 32%,transparent 36%),conic-gradient(from 0deg,transparent 0 5%,currentColor 5% 7%,transparent 7% 17%,currentColor 17% 19%,transparent 19% 30%,currentColor 30% 32%,transparent 32% 45%,currentColor 45% 47%,transparent 47% 60%,currentColor 60% 62%,transparent 62% 75%,currentColor 75% 77%,transparent 77% 90%,currentColor 90% 92%,transparent 92%);-webkit-mask:radial-gradient(circle,transparent 20%,#000 22%,#000 70%,transparent 72%)}
.f1{left:18%;top:20%;color:#ffd23f}.f2{left:72%;top:16%;color:#ff5d8f;animation-delay:.4s}.f3{left:45%;top:10%;color:#7ee36b;animation-delay:.8s}.f4{left:85%;top:34%;color:#5fd1ff;animation-delay:1.2s}
@keyframes fw{0%{opacity:0;transform:scale(.1)}15%{opacity:1}100%{opacity:0;transform:scale(1.2)}}
.rainfx{position:absolute;inset:-20%;background:repeating-linear-gradient(105deg,transparent 0 14px,rgba(255,255,255,.35) 14px 16px);animation:rain .45s linear infinite;pointer-events:none}
@keyframes rain{to{transform:translate(-30px,60px)}}
/* report grade badge */
.gradeBadge{font-size:44px;line-height:1;font-weight:900;font-style:italic;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);padding:0 6px}
/* coach Gus */
#coach{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,160%);display:flex;gap:10px;align-items:center;width:min(520px,94vw);background:#fffdf5;border:3px solid var(--ink);border-radius:20px;padding:8px 12px;box-shadow:0 6px 0 var(--ink);z-index:16;transition:transform .45s cubic-bezier(.2,1.5,.4,1);cursor:pointer}
#coach{opacity:0;pointer-events:none}
#coach.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#coach .ava{flex:0 0 auto;border:3px solid var(--ink);border-radius:50%;background:#d6f1ff}
#coach p{margin:2px 0 0;font-size:14px;font-weight:500}
@media (max-width:760px){#coach{bottom:calc(112px + env(safe-area-inset-bottom))}}
/* final hour tension */
body.finalHour .clock{background:#ffe1e1;animation:tense 1s ease-in-out infinite}
@keyframes tense{50%{transform:scale(1.07);box-shadow:0 4px 0 var(--ink),0 0 0 6px rgba(255,90,90,.35)}}
/* milestone cinematic: sunburst + ribbon */
#cine::before{content:'';position:absolute;inset:-50%;background:repeating-conic-gradient(rgba(255,255,255,.35) 0 10deg,transparent 10deg 20deg);animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cineBox{position:relative}
.cineBox h1{background:#ff5d8f;-webkit-text-stroke:0;color:#fff;text-shadow:0 4px 0 var(--ink);border:4px solid var(--ink);border-radius:14px;padding:4px 26px;display:inline-block;box-shadow:0 6px 0 var(--ink);transform:rotate(-2deg)}

/* ===== pixel art overhaul ===== */
img.pix,.ava.pix,#pxscene{image-rendering:pixelated;image-rendering:crisp-edges}
.avaWrap .ava.pix{border-radius:8px;background:linear-gradient(180deg,#5d86a8,#2e4a6a);border:2.5px solid var(--ink)}

#pxscene{position:fixed;inset:0;width:100vw;height:100vh;z-index:46;background:#000;display:none;cursor:pointer;object-fit:contain}
#pxscene.show{display:block;animation:pxIn .25s ease-out}

@keyframes pxIn{from{filter:brightness(4)}}
.arcade{background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.18),transparent 60%)}
.logoPx{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:10px}

.title .tag{width:min(560px,90vw);height:auto;margin-top:18px}
.pressStart img{height:24px;width:auto;animation:blink 1s steps(2) infinite;margin:8px 0}
.titleBtns{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:min(360px,90vw)}
.soundRow{justify-content:center;color:#fff}
.copyright{text-align:center;color:#fff;font-size:12px;margin-top:10px}

.mgrGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0}

.mcard .mlabel{height:16px;width:auto;max-width:100%}
.mcard.on{outline:4px solid #ffd23f;outline-offset:3px;transform:translateY(-4px);box-shadow:0 9px 0 var(--ink)}
.p1{position:absolute;top:-30px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;animation:bob .6s infinite}
